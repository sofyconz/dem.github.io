<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кроссворды — Медицинские темы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            margin: 20px auto;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 1px 1px 2px rgba(102, 126, 234, 0.2);
        }

        /* Меню выбора кроссворда */
        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .menu-btn {
            padding: 15px 40px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .menu-btn.anatomy {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.4);
        }

        .menu-btn.pharma {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.4);
        }

        .menu-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
        }

        .menu-btn.active {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
        }

        /* Секция кроссворда */
        .crossword-section {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .crossword-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .crossword-title {
            text-align: center;
            font-size: 1.8em;
            margin-bottom: 30px;
            padding: 15px;
            border-radius: 15px;
        }

        .crossword-title.anatomy-title {
            background: linear-gradient(135deg, #f093fb20, #f5576c20);
            color: #f5576c;
            border: 2px solid #f5576c40;
        }

        .crossword-title.pharma-title {
            background: linear-gradient(135deg, #4facfe20, #00f2fe20);
            color: #4facfe;
            border: 2px solid #4facfe40;
        }

        .crossword-layout {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        /* Сетка кроссворда */
        .grid-container {
            flex-shrink: 0;
        }

        .crossword-grid {
            display: inline-grid;
            gap: 2px;
            background: #e0e0e0;
            padding: 2px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .cell {
            width: 42px;
            height: 42px;
            position: relative;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell.black {
            background: #2d2d2d;
            border-radius: 3px;
        }

        .cell input {
            width: 100%;
            height: 100%;
            border: 2px solid #e0e0e0;
            text-align: center;
            font-size: 1.2em;
            font-weight: 700;
            text-transform: uppercase;
            outline: none;
            transition: all 0.2s ease;
            border-radius: 3px;
            background: white;
        }

        .cell input:focus {
            border-color: #667eea;
            background: #f0f0ff;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .cell input.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .cell input.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        .cell .cell-number {
            position: absolute;
            top: 2px;
            left: 3px;
            font-size: 0.6em;
            font-weight: 700;
            color: #667eea;
            z-index: 1;
            pointer-events: none;
        }

        /* Подсказки */
        .clues-container {
            flex: 1;
            min-width: 300px;
        }

        .clues-section {
            margin-bottom: 25px;
        }

        .clues-section h3 {
            font-size: 1.3em;
            margin-bottom: 15px;
            padding: 10px 20px;
            border-radius: 10px;
            color: white;
        }

        .clues-section h3.across {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .clues-section h3.down {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .clue-item {
            padding: 10px 15px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95em;
            line-height: 1.4;
        }

        .clue-item:hover {
            background: #e8ecff;
            transform: translateX(5px);
        }

        .clue-item .clue-num {
            font-weight: 700;
            color: #667eea;
            margin-right: 8px;
        }

        /* Кнопки управления */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .ctrl-btn {
            padding: 12px 30px;
            font-size: 1em;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .ctrl-btn.check {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            box-shadow: 0 5px 15px rgba(56, 239, 125, 0.3);
        }

        .ctrl-btn.clear {
            background: linear-gradient(135deg, #fc5c7d, #6a82fb);
            box-shadow: 0 5px 15px rgba(106, 130, 251, 0.3);
        }

        .ctrl-btn.reveal {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            box-shadow: 0 5px 15px rgba(255, 210, 0, 0.3);
            color: #333;
        }

        .ctrl-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        /* Сообщение о результате */
        .result-message {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            display: none;
        }

        .result-message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
            animation: pulse 0.5s ease;
        }

        .result-message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* Декоративные элементы */
        .decoration {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2em;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.8em;
            }

            .cell {
                width: 34px;
                height: 34px;
            }

            .cell input {
                font-size: 1em;
            }

            .crossword-layout {
                flex-direction: column;
                align-items: center;
            }

            .menu-btn {
                padding: 12px 25px;
                font-size: 1em;
            }
        }

        /* Футер */
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 Медицинские кроссворды</h1>

        <!-- Меню выбора -->
        <div class="menu">
            <button class="menu-btn anatomy active" onclick="showCrossword('anatomy')">🫀 Анатомия</button>
            <button class="menu-btn pharma" onclick="showCrossword('pharma')">💊 Фармакология</button>
        </div>

        <!-- Кроссворд: Анатомия -->
        <div id="crossword-anatomy" class="crossword-section active">
            <div class="crossword-title anatomy-title">🫀 Кроссворд по анатомии</div>
            <div class="decoration">🦴 🧠 ❤️ 🫁</div>

            <div class="crossword-layout">
                <div class="grid-container">
                    <div class="crossword-grid" id="grid-anatomy"></div>
                </div>

                <div class="clues-container">
                    <div class="clues-section">
                        <h3 class="across">→ По горизонтали</h3>
                        <div id="clues-across-anatomy"></div>
                    </div>
                    <div class="clues-section">
                        <h3 class="down">↓ По вертикали</h3>
                        <div id="clues-down-anatomy"></div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="ctrl-btn check" onclick="checkAnswers('anatomy')">✓ Проверить</button>
                <button class="ctrl-btn reveal" onclick="revealAnswers('anatomy')">💡 Показать ответы</button>
                <button class="ctrl-btn clear" onclick="clearGrid('anatomy')">🗑 Очистить</button>
            </div>

            <div id="result-anatomy" class="result-message"></div>
        </div>

        <!-- Кроссворд: Фармакология -->
        <div id="crossword-pharma" class="crossword-section">
            <div class="crossword-title pharma-title">💊 Кроссворд по фармакологии</div>
            <div class="decoration">💉 🧪 💊 🩺</div>

            <div class="crossword-layout">
                <div class="grid-container">
                    <div class="crossword-grid" id="grid-pharma"></div>
                </div>

                <div class="clues-container">
                    <div class="clues-section">
                        <h3 class="across">→ По горизонтали</h3>
                        <div id="clues-across-pharma"></div>
                    </div>
                    <div class="clues-section">
                        <h3 class="down">↓ По вертикали</h3>
                        <div id="clues-down-pharma"></div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="ctrl-btn check" onclick="checkAnswers('pharma')">✓ Проверить</button>
                <button class="ctrl-btn reveal" onclick="revealAnswers('pharma')">💡 Показать ответы</button>
                <button class="ctrl-btn clear" onclick="clearGrid('pharma')">🗑 Очистить</button>
            </div>

            <div id="result-pharma" class="result-message"></div>
        </div>

        <div class="footer">
            <p>📚 Образовательный проект • Медицинские кроссворды • 2026</p>
        </div>
    </div>

    <script>
        // Данные кроссворда "Анатомия"
        const anatomyData = {
            rows: 10,
            cols: 10,
            words: [
                { word: "СЕРДЦЕ", row: 0, col: 0, dir: "across", num: 1, clue: "Мышечный орган, перекачивающий кровь" },
                { word: "МОЗГ", row: 0, col: 0, dir: "down", num: 1, clue: "Главный орган нервной системы" },
                { word: "ПЕЧЕНЬ", row: 2, col: 2, dir: "across", num: 2, clue: "Самая крупная железа организма" },
                { word: "ПОЧКА", row: 0, col: 4, dir: "down", num: 3, clue: "Орган мочевыделительной системы" },
                { word: "КОСТЬ", row: 4, col: 0, dir: "across", num: 4, clue: "Твёрдый элемент скелета" },
                { word: "МЫШЦА", row: 4, col: 0, dir: "down", num: 4, clue: "Орган, способный сокращаться" },
                { word: "ЛЁГКИЕ", row: 5, col: 3, dir: "across", num: 5, clue: "Парный орган дыхания" },
                { word: "КОЖА", row: 7, col: 1, dir: "across", num: 6, clue: "Наружный покров тела" },
                { word: "КРОВЬ", row: 3, col: 5, dir: "down", num: 7, clue: "Жидкая соединительная ткань" },
                { word: "НЕРВ", row: 7, col: 4, dir: "down", num: 8, clue: "Пучок волокон, передающих сигналы" },
            ]
        };

        // Данные кроссворда "Фармакология"
        const pharmaData = {
            rows: 10,
            cols: 10,
            words: [
                { word: "АСПИРИН", row: 0, col: 1, dir: "across", num: 1, clue: "Жаропонижающее средство из коры ивы" },
                { word: "АНТИБИОТИК", row: 0, col: 1, dir: "down", num: 1, clue: "Препарат для борьбы с бактериями" },
                { word: "ВИТАМИН", row: 2, col: 3, dir: "across", num: 2, clue: "Необходимое органическое вещество" },
                { word: "ДОЗА", row: 0, col: 5, dir: "down", num: 3, clue: "Количество лекарства на приём" },
                { word: "ТАБЛЕТКА", row: 4, col: 0, dir: "across", num: 4, clue: "Твёрдая лекарственная форма" },
                { word: "МАЗЬ", row: 2, col: 7, dir: "down", num: 5, clue: "Мягкая наружная лекарственная форма" },
                { word: "ВАКЦИНА", row: 6, col: 1, dir: "across", num: 6, clue: "Препарат для создания иммунитета" },
                { word: "КАПСУЛА", row: 4, col: 5, dir: "down", num: 7, clue: "Лекарственная оболочка с порошком внутри" },
                { word: "СИРОП", row: 8, col: 2, dir: "across", num: 8, clue: "Сладкая лекарственная жидкость" },
                { word: "ЙОД", row: 6, col: 5, dir: "down", num: 9, clue: "Антисептик коричневого цвета" },
            ]
        };

        // Построение сетки кроссворда
        function buildGrid(type, data) {
            const grid = document.getElementById(`grid-${type}`);
            grid.innerHTML = '';
            grid.style.gridTemplateColumns = `repeat(${data.cols}, 42px)`;
            grid.style.gridTemplateRows = `repeat(${data.rows}, 42px)`;

            // Создаём матрицу
            let matrix = [];
            for (let r = 0; r < data.rows; r++) {
                matrix[r] = [];
                for (let c = 0; c < data.cols; c++) {
                    matrix[r][c] = { letter: null, number: null };
                }
            }

            // Заполняем матрицу буквами
            data.words.forEach(w => {
                for (let i = 0; i < w.word.length; i++) {
                    let r = w.dir === "down" ? w.row + i : w.row;
                    let c = w.dir === "across" ? w.col + i : w.col;
                    if (r < data.rows && c < data.cols) {
                        matrix[r][c].letter = w.word[i];
                    }
                }
            });

            // Назначаем номера ячейкам
            data.words.forEach(w => {
                if (!matrix[w.row][w.col].number) {
                    matrix[w.row][w.col].number = w.num;
                }
            });

            // Рендерим ячейки
            for (let r = 0; r < data.rows; r++) {
                for (let c = 0; c < data.cols; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');

                    if (matrix[r][c].letter) {
                        if (matrix[r][c].number) {
                            const numSpan = document.createElement('span');
                            numSpan.classList.add('cell-number');
                            numSpan.textContent = matrix[r][c].number;
                            cell.appendChild(numSpan);
                        }
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.maxLength = 1;
                        input.dataset.row = r;
                        input.dataset.col = c;
                        input.dataset.answer = matrix[r][c].letter;
                        input.addEventListener('input', handleInput);
                        input.addEventListener('keydown', handleKeydown);
                        cell.appendChild(input);
                    } else {
                        cell.classList.add('black');
                    }

                    grid.appendChild(cell);
                }
            }
        }

        // Рендер подсказок
        function buildClues(type, data) {
            const acrossContainer = document.getElementById(`clues-across-${type}`);
            const downContainer = document.getElementById(`clues-down-${type}`);
            acrossContainer.innerHTML = '';
            downContainer.innerHTML = '';

            data.words.forEach(w => {
                const div = document.createElement('div');
                div.classList.add('clue-item');
                div.innerHTML = `<span class="clue-num">${w.num}.</span>${w.clue}`;
                div.addEventListener('click', () => focusWord(type, w));

                if (w.dir === "across") {
                    acrossContainer.appendChild(div);
                } else {
                    downContainer.appendChild(div);
                }
            });
        }

        // Фокус на первое слово
        function focusWord(type, word) {
            const grid = document.getElementById(`grid-${type}`);
            const inputs = grid.querySelectorAll('input');
            inputs.forEach(inp => {
                if (parseInt(inp.dataset.row) === word.row && parseInt(inp.dataset.col) === word.col) {
                    inp.focus();
                }
            });
        }

        // Обработка ввода
        function handleInput(e) {
            const input = e.target;
            input.value = input.value.toUpperCase();
            input.classList.remove('correct', 'incorrect');

            if (input.value) {
                moveToNext(input);
            }
        }

        // Переход к следующей ячейке
        function moveToNext(current) {
            const grid = current.closest('.crossword-grid');
            const inputs = Array.from(grid.querySelectorAll('input'));
            const idx = inputs.indexOf(current);
            if (idx < inputs.length - 1) {
                inputs[idx + 1].focus();
            }
        }

        // Обработка клавиш
        function handleKeydown(e) {
            const input = e.target;
            const grid = input.closest('.crossword-grid');
            const inputs = Array.from(grid.querySelectorAll('input'));
            const idx = inputs.indexOf(input);

            if (e.key === 'Backspace' && !input.value && idx > 0) {
                inputs[idx - 1].focus();
                inputs[idx - 1].value = '';
                e.preventDefault();
            }
        }

        // Проверка ответов
        function checkAnswers(type) {
            const grid = document.getElementById(`grid-${type}`);
            const inputs = grid.querySelectorAll('input');
            let allCorrect = true;
            let filled = 0;

            inputs.forEach(inp => {
                inp.classList.remove('correct', 'incorrect');
                if (inp.value) {
                    filled++;
                    if (inp.value === inp.dataset.answer) {
                        inp.classList.add('correct');
                    } else {
                        inp.classList.add('incorrect');
                        allCorrect = false;
                    }
                } else {
                    allCorrect = false;
                }
            });

            const resultDiv = document.getElementById(`result-${type}`);
            if (allCorrect && filled === inputs.length) {
                resultDiv.className = 'result-message success';
                resultDiv.textContent = '🎉 Поздравляем! Кроссворд разгадан правильно!';
            } else {
                resultDiv.className = 'result-message error';
                resultDiv.textContent = `Заполнено ${filled} из ${inputs.length}. Есть ошибки — попробуйте ещё!`;
            }
        }

        // Показать ответы
        function revealAnswers(type) {
            const grid = document.getElementById(`grid-${type}`);
            const inputs = grid.querySelectorAll('input');
            inputs.forEach(inp => {
                inp.value = inp.dataset.answer;
                inp.classList.add('correct');
                inp.classList.remove('incorrect');
            });
            const resultDiv = document.getElementById(`result-${type}`);
            resultDiv.className = 'result-message success';
            resultDiv.textContent = '💡 Ответы показаны';
        }

        // Очистить сетку
        function clearGrid(type) {
            const grid = document.getElementById(`grid-${type}`);
            const inputs = grid.querySelectorAll('input');
            inputs.forEach(inp => {
                inp.value = '';
                inp.classList.remove('correct', 'incorrect');
            });
            const resultDiv = document.getElementById(`result-${type}`);
            resultDiv.className = 'result-message';
            resultDiv.textContent = '';
        }

        // Переключение кроссвордов
        function showCrossword(type) {
            document.querySelectorAll('.crossword-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));

            document.getElementById(`crossword-${type}`).classList.add('active');
            document.querySelector(`.menu-btn.${type}`).classList.add('active');
        }

        // Инициализация
        buildGrid('anatomy', anatomyData);
        buildClues('anatomy', anatomyData);
        buildGrid('pharma', pharmaData);
        buildClues('pharma', pharmaData);
    </script>
</body>
</html>
